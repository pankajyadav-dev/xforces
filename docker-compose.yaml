services:
  xforces:
    container_name: xforces-dev
    build:
      context: .
      dockerfile: apps/xforces/Dockerfile.dev
    restart: always
    environment:
      - DATABASE_URL=postgres://virat:virat123@postgres:5432/xforcesdb
      - REDIS_URL=redis://redisdb:6379/1
    volumes:
      - ./apps/xforces:/app/apps/xforces
      # - /app/apps/xforces/node_modules
      # - /app/apps/xforces/.next
      # - /app/node_modules
      - ./packages:/app/packages
      # - /app/packages/db/node_modules 
    ports:
      - "3000:3000" 
    depends_on:
      - postgres
      - redis

  # engine:
